[package]
name = "dedupit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Incremental file and extent deduplication with kernel-verified sharing"
license = "MIT"

[features]
# Deterministic process-stop hooks used only by crash tests, never enabled by default.
test-failpoints = []

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["ioctl"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

